<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дякуємо за оплату — Kailash Dham</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 20px; }
  h1 { font-size: 24px; color: #c9a96e; margin-bottom: 12px; }
  p { font-size: 15px; color: #999; line-height: 1.6; margin-bottom: 8px; }
  .btn {
    display: inline-block;
    margin-top: 32px;
    background: #c9a96e;
    color: #0f0f0f;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 10px;
    transition: background .2s;
  }
  .btn:hover { background: #b8945a; }
  .sub { margin-top: 16px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🙏</div>
  <h1 id="title">Дякуємо за оплату!</h1>
  <p id="line1">Ваш платіж отримано.</p>
  <p id="line2">Наш менеджер зв'яжеться з вами найближчим часом для підтвердження участі.</p>
  <a href="https://t.me/kailashdham_bot" class="btn" id="btn">Повернутися в бот</a>
  <p class="sub" id="sub">@kailashdham_bot</p>
</div>

<script>
const lang = localStorage.getItem('kd_lang') || navigator.language.startsWith('ru') ? 'ru' : navigator.language.startsWith('en') ? 'en' : 'uk';
const texts = {
  uk: {
    title: 'Дякуємо за оплату!',
    line1: 'Ваш платіж отримано.',
    line2: 'Наш менеджер зв\'яжеться з вами найближчим часом для підтвердження участі.',
    btn: 'Повернутися в бот',
  },
  ru: {
    title: 'Спасибо за оплату!',
    line1: 'Ваш платёж получен.',
    line2: 'Наш менеджер свяжется с вами в ближайшее время для подтверждения участия.',
    btn: 'Вернуться в бот',
  },
  en: {
    title: 'Thank you for your payment!',
    line1: 'Your payment has been received.',
    line2: 'Our manager will contact you shortly to confirm your participation.',
    btn: 'Return to bot',
  },
};
const t = texts[lang] || texts.uk;
document.getElementById('title').textContent = t.title;
document.getElementById('line1').textContent = t.line1;
document.getElementById('line2').textContent = t.line2;
document.getElementById('btn').textContent = t.btn;
</script>
</body>
</html>
